name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Este paso es el que arregla el problema:
    - name: Ensure app directory exists
      run: |
        if [ ! -d "app" ] && [ -d "SolitarioTV/app" ]; then
          echo "La carpeta app está dentro de SolitarioTV. Moviendo archivos..."
          mv SolitarioTV/* .
          mv SolitarioTV/.* . 2>/dev/null || true
          rmdir SolitarioTV
        fi

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: solitario-apk
        path: app/build/outputs/apk/debug/app-debug.apk
